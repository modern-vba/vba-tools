name: Verify release preparation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vba-tools-release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: startsWith(github.head_ref, 'codex/issue-246-release-')
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Check out the release preparation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        shell: pwsh
        run: npm install --global (node -p "require('./package.json').packageManager")
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      - name: Restore locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Verify the ordinary hosted release gate without Excel
        run: npm run verify:release
      - name: Retain isolated VBA failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-preparation-vba-logs-${{ github.run_attempt }}
          path: .tmp/extension-host-failures/**/output_logging_*/*VBA*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
